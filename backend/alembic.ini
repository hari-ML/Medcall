# Alembic configuration for MedRecall.
#
# Usage (from backend/):
#   alembic upgrade head                 apply all migrations
#   alembic revision --autogenerate -m   generate a new migration (dev DB!)
#   alembic stamp 0001_baseline          mark an EXISTING dev DB as migrated
#
# The database URL is injected by alembic/env.py from app.db._resolve_db_url()
# (same MEDRECALL_DB / default-file resolution the app itself uses) — the
# sqlalchemy.url below is only the offline-mode fallback.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///medrecall.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
